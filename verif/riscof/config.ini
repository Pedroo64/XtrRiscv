[RISCOF]
ReferencePlugin=sail_cSim
ReferencePluginPath=./sail_cSim
DUTPlugin=xtrriscv
DUTPluginPath=./xtrriscv

[xtrriscv]
pluginpath=./xtrriscv
ispec=./xtrriscv/xtrriscv_isa.yaml
pspec=./xtrriscv/xtrriscv_platform.yaml
execute_bypass=true
memory_bypass=true
writeback_bypass=true
regfile_bypass=true
full_barrel_shifter=true
shifter_early_injection=true
riscv_prefix=riscv64-unknown-elf-
ghdl=./../../rtl/proj/ghdl
jobs=4

[sail_cSim]
pluginpath=./sail_cSim
docker=True
image=registry.gitlab.com/incoresemi/docker-images/compliance
riscv_prefix=riscv64-unknown-elf-
jobs=4
